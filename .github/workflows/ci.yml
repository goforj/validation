name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.24.x'
          cache-dependency-path: '**/go.mod'
      - name: Check both modules on the minimum Go line
        run: make test vet
      - name: Verify public installation without local replacements
        if: github.event_name == 'push'
        run: make verify-consumer

  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: '**/go.mod'
      - name: Check formatting, module inventory, and tidy parity
        run: |
          test -z "$(gofmt -l .)"
          make modules-check tidy
          test -z "$(git status --porcelain -- go.mod go.sum docs/go.mod docs/go.sum)"
      - name: Check race behavior and vet
        run: make test-race vet
      - name: Enforce exact unit coverage and generated parity
        run: |
          make test-coverage
          make check-generated
          git diff --exit-code -- README.md docs/assets
      - name: Verify public installation without local replacements
        if: github.event_name == 'push'
        run: make verify-consumer
      - name: Upload unit coverage
        uses: codecov/codecov-action@2320916714171c258d01dbd81040d64d798c6f8e # v7.1.1
        with:
          files: .artifacts/unit-coverage.out
          flags: unit
          use_oidc: true
          fail_ci_if_error: true
